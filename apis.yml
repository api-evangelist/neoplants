name: Neoplants
description: >-
  Neoplants is a French climate-biotechnology company building genetically and
  microbially engineered houseplants that capture and metabolize indoor air
  pollutants. Its consumer product line pairs bioengineered pothos plants with
  an enhanced root microbiome ("Power Drops") to remove volatile organic
  compounds such as formaldehyde, benzene, toluene and xylene from indoor air.
  Backed by Partech and other climate investors, Neoplants operates as a
  direct-to-consumer brand rather than an API provider. This API Evangelist
  profile was created from a venture-portfolio lead; an enrichment pass confirmed
  the company publishes no developer API, OpenAPI, developer portal, or
  machine-readable API surface as of July 2026.
